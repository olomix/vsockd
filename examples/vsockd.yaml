# vsockd example configuration.
#
# Inbound listeners cover HTTPS transparent SNI passthrough and plaintext
# HTTP Host-based routing. Outbound includes a shared forward-proxy port
# with per-CID egress allowlists plus a dedicated unrestricted port for a
# test enclave. Raw-TCP passthrough (non-HTTP workloads: databases, gRPC,
# arbitrary protocols) lives under its own top-level sections tcp_to_vsock
# (TCP → vsock) and vsock_to_tcp (vsock → TCP); these work identically
# whether vsockd runs on the parent host or inside the enclave. log_relay
# is the host-side vsock log sink: it reads enclave NDJSON line by line,
# enriches each record with host-only metadata (peer CID + host tags), and
# lands it in a local file or stdout. The schema is documented in
# internal/config/config.go and validated strictly at load time.

inbound:
  # HTTPS: terminate TCP on the host, extract SNI, pass the TLS record
  # through untouched to the enclave — the enclave owns the cert.
  - bind: 0.0.0.0
    port: 443
    mode: tls-sni
    routes:
      - hostname: api.example.com
        cid: 16
        vsock_port: 8443
      - hostname: admin.example.com
        cid: 20
        vsock_port: 8443

  # HTTP: route by Host header.
  - bind: 0.0.0.0
    port: 80
    mode: http-host
    routes:
      - hostname: api.example.com
        cid: 16
        vsock_port: 8080

outbound:
  # Shared forward-proxy vsock port used by two enclaves. Each CID carries
  # its own egress allowlist; a CID may not appear under more than one port.
  - port: 8080
    cids:
      - cid: 16
        allowed_hosts:
          - "api.stripe.com:443"
          - "*.s3.amazonaws.com:443"
      - cid: 20
        allowed_hosts:
          - "*.internal.example.com:443"

  # Dedicated port for a test enclave with no egress restrictions.
  - port: 8082
    cids:
      - cid: 42
        allowed_hosts:
          - "*"

# Raw TCP passthrough (TCP → vsock). Accepts TCP on bind:port and pipes
# bytes to a fixed vsock endpoint. Works both on the parent host (forwarding
# external TCP into an enclave) and inside the enclave (forwarding local TCP
# to the parent host's vsock). No application-layer parsing, no allowlist —
# useful for databases, gRPC, or anything non-HTTP.
tcp_to_vsock:
  - bind: 0.0.0.0
    port: 5432
    vsock_cid: 16
    vsock_port: 5432

# Raw TCP passthrough (vsock → TCP). Accepts vsock on this port and pipes
# bytes to a fixed upstream host:port. Symmetric to tcp_to_vsock: works on
# the parent host (outbound from enclave) or inside the enclave (outbound to
# the parent host). No HTTP parsing, no allowlist; any peer CID that
# connects reaches the upstream.
vsock_to_tcp:
  - port: 9000
    upstream: 10.0.0.5:5432

# Host-side vsock log sink + enrichment (vsock → local sink). Accepts vsock
# connections, reads the incoming NDJSON stream line by line, enriches each
# record with host-only metadata, and writes the enriched lines to a local
# sink (an append-only file or stdout). It is the host endpoint for enclave
# log delivery: an in-enclave supervisor connects out to the parent (CID 3)
# on this port and ships framed NDJSON; log_relay lands it on the host where
# a delivery agent (CloudWatch agent / vector / fluent-bit) or journald takes
# over.
#
# Two-layer enrichment, each side in its own namespace, NO merging:
#   - the supervisor (inside the enclave) owns "tags" (e.g. service, version);
#   - log_relay (on the host) adds the un-spoofable peer "cid" and a host-tags
#     object the enclave cannot see (region, instance, …).
# log_relay deliberately does NOT merge host data into the enclave's "tags"
# (or rewrite the record). Merging would force a full JSON decode/re-encode —
# mangling int64s (pids/timestamps lose precision as float64) and reordering
# keys — and impose a collision policy that is not vsockd's to make. Records
# are spliced byte-for-byte: the host prefix ("cid":N,"<host_key>":{…},) is
# inserted right after the opening brace, every original byte preserved. Any
# reshaping/flattening/merging is the downstream log-processing pipeline's
# job, intentionally outside vsockd's scope.
#
# Rules: `output` is required and is one of `file` | `stdout`. `path` is
# required iff `output: file` and must be absent for `output: stdout`.
# `max_line_bytes` is optional (default 1 MiB); an over-long line is not
# dropped — it is emitted as a truncated `raw` record and counted. A line
# that is not a valid JSON object is wrapped as a `raw` record carrying the
# original text in `msg`, so output is always well-formed NDJSON whenever an
# `enrich` block is present (even an empty `enrich: {}`). A record that
# already carries a top-level key the host adds (its own "cid" or the host
# key) is likewise wrapped as `raw` rather than spliced, so the host's fields
# stay un-spoofable (duplicate top-level keys would otherwise let last-wins
# parsers shadow the host "cid"). `enrich` is optional; with no `enrich` block
# the listener is a verbatim, line-framed pass-through — lines are framed and
# length-bounded but emitted unmodified (non-JSON lines are not wrapped, so
# output is NDJSON only if the producer sends it), though an over-long line is
# still flagged as a truncated `raw` record. v1 handles one connection at a
# time per listener
# (single-producer supervisor expectation).
log_relay:
  - port: 5140
    output: file
    path: /var/log/enclave/app.ndjson
    max_line_bytes: 1048576      # optional; default 1 MiB
    enrich:
      cid: true                  # add top-level "cid": <peer CID>
      host_key: host             # optional; key for host tags (default "host")
      tags:                      # host-only metadata, emitted under host_key
        region: us-east-1
        instance: i-0abc123

  # stdout sink, no enrich → framed, bounded pass-through. Note: relayed logs
  # then share vsockd's own process stdout; vsockd's slog still goes to stderr,
  # but mixing the two streams on stdout is a documented consequence — prefer a
  # file sink (or run vsockd's logs through stderr only) if that matters.
  - port: 5141
    output: stdout

# Prometheus /metrics endpoint. Disabled by default — omit this section
# (or pass -metrics-addr "") to leave the endpoint off. Use `bind` on the
# parent host to serve over TCP, or `vsock_port` inside the enclave so the
# parent host can scrape over vsock. `bind` and `vsock_port` are mutually
# exclusive.
metrics:
  bind: 0.0.0.0:9090
  # vsock_port: 9090

# Maximum time to wait for in-flight connections to drain on SIGTERM.
shutdown_grace: 30s

# json | text | auto — "auto" picks text when stderr is a TTY.
log_format: json

# info | debug (default: info). Enables per-connection open/close debug
# logs for tcp_to_vsock and vsock_to_tcp listeners. Can also be set via
# the `-debug` flag or the VSOCKD_LOG_LEVEL env var; precedence is
# flag > env > yaml.
log_level: info
